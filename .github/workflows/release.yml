name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: macos-arm64
          - os: ubuntu-latest
            target: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pyinstaller
      - name: Build binary
        run: |
          pyinstaller --onefile \
            --name tahtlang-${{ matrix.target }} \
            --hidden-import tahtlang.parser \
            --hidden-import tahtlang.parser.lexer \
            --hidden-import tahtlang.parser.parser \
            --hidden-import tahtlang.parser.ast \
            --hidden-import tahtlang.parser.errors \
            --hidden-import tahtlang.parser.validator \
            --hidden-import tahtlang.compiler \
            --hidden-import tahtlang.compiler.main \
            --hidden-import tahtlang.runtime \
            --hidden-import tahtlang.runtime.engine \
            --hidden-import tahtlang.runtime.drivers \
            --hidden-import tahtlang.runtime.tui \
            -c tahtlang/compiler/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: tahtlang-${{ matrix.target }}
          path: dist/tahtlang-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: tahtlang-*
